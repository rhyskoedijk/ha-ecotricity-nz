name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Attach zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          jq --arg v "$TAG" '.version = $v' custom_components/ecotricity_nz/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/ecotricity_nz/manifest.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          # A release is built from a clean install, never from a cache another run could fill.
          package-manager-cache: false

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the zip
        run: |
          cd custom_components/ecotricity_nz
          zip -r "$GITHUB_WORKSPACE/ha_ecotricity_nz.zip" . -x "__pycache__/*" "*.pyc"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ha_ecotricity_nz.zip --repo "$GITHUB_REPOSITORY"
