# `pre-commit install` (run by scripts/setup) installs the commit message hooks too.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Run the project's own pinned tools, so pre-commit and CI always agree.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend type check
        entry: npm run typecheck --prefix frontend
        language: system
        files: ^frontend/(src|test)/.*\.ts$|^frontend/tsconfig\.json$
        pass_filenames: false
      - id: translations-match
        name: translations/en.json matches strings.json
        entry: cmp custom_components/ecotricity_nz/strings.json custom_components/ecotricity_nz/translations/en.json
        language: system
        files: ^custom_components/ecotricity_nz/(strings\.json|translations/en\.json)$
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: shellcheck
        name: shellcheck
        entry: uv run shellcheck
        language: system
        types: [shell]

      # Commit messages, as CLAUDE.md "Commit messages" says.
      - id: commit-subject
        name: commit subject follows Conventional Commits
        entry: '\A(?:(?:fix|feat|refactor|docs|test|build|ci|chore)(?:\([^)]+\))?!?: [a-z0-9`]|Merge |Revert "|fixup! |squash! |amend! )'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]
      - id: commit-no-ai-mention
        name: commit message has no co-author or AI tool line
        entry: '(?im)^co-authored-by:|generated with \[?claude|noreply@anthropic\.com'
        language: pygrep
        stages: [commit-msg]
